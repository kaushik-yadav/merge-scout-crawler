[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mergescout"
version = "0.0.1"
description = "Find open-source issues you can actually get merged, with evidence."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "orjson>=3.10", "pyarrow>=17", "tzdata>=2024.1; sys_platform == 'win32'"]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Only the private signals build needs DuckDB; the crawler and end users do not.
pipeline = ["duckdb>=1.1", "pytz"]

[tool.hatch.build.targets.wheel]
packages = ["src/mergescout"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: hits the real internet; run with MS_NETWORK_TESTS=1"]
