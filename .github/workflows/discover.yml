name: Discover

on:
  schedule:
    - cron: "41 3 * * *"
    # Backup in case GitHub skips the first; it stops after a minute when today's run already happened.
    - cron: "41 15 * * *"
  workflow_dispatch:
    inputs:
      full_sweep:
        description: "Start a fresh sweep of active repos"
        type: boolean
        default: false
      bootstrap:
        description: "First setup only: allow starting without any saved crawl state"
        type: boolean
        default: false

concurrency:
  group: crawl-state
  cancel-in-progress: false

permissions:
  contents: read
  # Lets discovery hand over to the crawl when it finishes (the relay).
  actions: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MS_DATA_DIR: ${{ github.workspace }}/data
      # Sweep results and state backups are kept in the project repo's releases.
      MS_RELEASE_TOKEN: ${{ secrets.MS_STORE_TOKEN }}
      MS_STORE_REPO: kaushik-yadav/merge-scout
    steps:
      # Checkout first: it empties the folder, so the restored state must come after it.
      - uses: actions/checkout@v4
      - name: Restore state from the cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: data
          key: crawl-state-${{ github.run_id }}
          restore-keys: crawl-state-
      - name: Skip a scheduled run when today's discovery already happened
        id: guard
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(cat data/last-discover 2>/dev/null)" = "$(date -u +%F)" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Today's discovery already ran; nothing to do."
          fi
      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - if: steps.guard.outputs.skip != 'true'
        run: pip install ".[crawl]"
      - name: Restore state from the releases if the cache is gone
        if: steps.guard.outputs.skip != 'true' && steps.cache.outputs.cache-matched-key == ''
        run: python -m mergescout.store pull
      - name: Make sure the crawl state is here (stops before anything can be overwritten)
        id: state
        if: steps.guard.outputs.skip != 'true'
        run: |
          if [ ! -s data/crawl.sqlite ] && [ "${{ inputs.bootstrap }}" != "true" ]; then
            echo "No crawl state in the cache or the releases; stopping so the good backup is never replaced."
            exit 1
          fi
      - name: Start a fresh sweep every Monday (new repos and fresh activity), or when asked
        if: steps.guard.outputs.skip != 'true'
        run: |
          weekday=$(date -u +%u)
          if [ "${{ inputs.full_sweep }}" = "true" ] || [ "$weekday" = "1" ] || [ ! -d data/discover ]; then
            rm -rf data/discover
            echo "fresh sweep"
          fi
      - name: Get a token for the MergeScout GitHub App (skipped until the App is set up)
        id: app
        if: steps.guard.outputs.skip != 'true' && vars.MS_APP_ID != ''
        continue-on-error: true
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.MS_APP_ID }}
          private-key: ${{ secrets.MS_APP_PRIVATE_KEY }}
      - name: Sweep active repos with 100+ stars (resumes a paused sweep, near-free when finished)
        if: steps.guard.outputs.skip != 'true'
        timeout-minutes: 75
        continue-on-error: true
        run: python -m mergescout.discover sweep --min-stars 100 --active-days 90 --workers 4 --max-wait 600
        env:
          GITHUB_TOKEN: ${{ secrets.MS_GITHUB_TOKEN }}
          # Extra identities with their own limits: the App (when set up) and this workflow's own token.
          MS_APP_TOKEN: ${{ steps.app.outputs.token }}
          MS_ACTIONS_TOKEN: ${{ github.token }}
      # Repos on the store's watch list are queued first so their history stays current; without it, nothing changes.
      - name: Fetch the watch list
        if: steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.MS_STORE_TOKEN }}
        run: gh release download bench-latest -R "$MS_STORE_REPO" -p watch-repos.txt -D data --clobber || echo "no watch list"
      - name: Queue watched repos first, then active repos, beginner-friendly ones first
        if: steps.guard.outputs.skip != 'true'
        run: python -m mergescout.crawl seed --watch data/watch-repos.txt
      - name: Remember that today's discovery happened
        if: steps.guard.outputs.skip != 'true'
        run: date -u +%F > data/last-discover
      - name: Back up state and sweep results to releases
        if: always() && steps.guard.outputs.skip != 'true' && steps.state.outcome == 'success'
        run: python -m mergescout.store push --with-discover
      - name: Save state to the cache
        if: always() && steps.guard.outputs.skip != 'true' && steps.state.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: data
          key: crawl-state-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Hand over to the crawl (the relay; set the repository variable MS_CHAIN to "off" to stop it)
        if: success() && steps.guard.outputs.skip != 'true' && vars.MS_CHAIN != 'off'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          next=$(python -m mergescout.crawl next --after-discover)
          echo "next: $next"
          if [ "$next" = "crawl" ]; then gh workflow run crawl.yml --ref "${{ github.ref_name }}"; fi
