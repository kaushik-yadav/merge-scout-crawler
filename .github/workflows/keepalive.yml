name: Keep schedules alive

on:
  schedule:
    # GitHub pauses schedules in public repos after 60 days without activity; a monthly commit prevents that.
    - cron: "23 4 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Commit a timestamp
        run: |
          date -u +%F > .github/keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive
          git commit -m "chore: Keep scheduled workflows active" && git push || echo "nothing to commit"
